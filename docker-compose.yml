# NEXUS with Postgres. Copy .env.example to .env, set NEXUS_PUBLIC_URL and NEXUS_SECRET_KEY, then:
#   docker compose up -d
# Put a TLS-terminating proxy in front of port 8000 for anything other than local use.
services:
  nexus:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NEXUS_DATABASE_URL: postgresql://nexus:${POSTGRES_PASSWORD:-nexus}@db:5432/nexus
      PORT: "8000"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexus}
      POSTGRES_DB: nexus
    volumes:
      - nexus-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nexus-db:
