<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{BRAND_NAME}}</title>
  <meta name="color-scheme" content="light dark">

    try { const t = localStorage.getItem("ml-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}

</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>

      <main class="view" id="view" tabindex="-1"></main>
    </div>
    <aside class="panel" id="panel" aria-label="Details" hidden></aside>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="/static/js/main.js"></script>

</html>
